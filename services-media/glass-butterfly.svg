<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Glass butterfly">
  <defs>
    <linearGradient id="gbA" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d7e3fa"/>
      <stop offset="0.42" stop-color="#f0d5e6"/>
      <stop offset="1" stop-color="#f2c2d8"/>
    </linearGradient>
    <linearGradient id="gbB" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e4ebfc"/>
      <stop offset="0.5" stop-color="#f6d9e7"/>
      <stop offset="1" stop-color="#eec0d8"/>
    </linearGradient>
    <linearGradient id="gbC" x1="0" y1="0.15" x2="1" y2="0.9">
      <stop offset="0" stop-color="#dae5fb"/>
      <stop offset="0.4" stop-color="#f3d7e7"/>
      <stop offset="0.85" stop-color="#f0c3da"/>
      <stop offset="1" stop-color="#e3b9d6"/>
    </linearGradient>
    <linearGradient id="gbD" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#cddef7"/>
      <stop offset="0.45" stop-color="#e6dbf3"/>
      <stop offset="1" stop-color="#f1c7db"/>
    </linearGradient>
    <linearGradient id="gbBody" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#fae6f0"/>
      <stop offset="0.45" stop-color="#eec1da"/>
      <stop offset="1" stop-color="#d9a7c9"/>
    </linearGradient>
    <linearGradient id="gbRim1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e9a8c9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="gbRim2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e0a3cb" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="gbSheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gbDepth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b57fa8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#b57fa8" stop-opacity="0"/>
    </radialGradient>
    <filter id="gbBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="gbBlurS" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="gbShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="16" stdDeviation="18" flood-color="#b3799f" flood-opacity="0.28"/>
    </filter>

    <path id="gbW1" d="M395 268 C 372 196, 322 100, 256 64 C 194 30, 138 88, 148 176 C 157 250, 300 302, 395 268 Z"/>
    <path id="gbW2" d="M392 288 C 332 282, 232 264, 176 310 C 118 358, 150 436, 236 434 C 312 432, 376 344, 392 288 Z"/>
    <path id="gbW3" d="M412 272 C 472 210, 560 132, 641 121 C 722 110, 748 202, 701 272 C 650 348, 482 334, 412 272 Z"/>
    <path id="gbW4" d="M406 296 C 462 302, 561 332, 581 392 C 602 454, 520 492, 455 462 C 394 434, 386 342, 406 296 Z"/>

    <clipPath id="gbC1"><use href="#gbW1"/></clipPath>
    <clipPath id="gbC2"><use href="#gbW2"/></clipPath>
    <clipPath id="gbC3"><use href="#gbW3"/></clipPath>
    <clipPath id="gbC4"><use href="#gbW4"/></clipPath>
  </defs>

  <g filter="url(#gbShadow)">

    <!-- upper left wing -->
    <use href="#gbW1" fill="url(#gbA)"/>
    <g clip-path="url(#gbC1)">
      <use href="#gbW1" fill="none" stroke="#d98cb9" stroke-opacity="0.75" stroke-width="30" filter="url(#gbBlur)"/>
      <ellipse cx="330" cy="290" rx="150" ry="90" fill="url(#gbDepth)" filter="url(#gbBlur)"/>
      <ellipse cx="228" cy="128" rx="86" ry="46" fill="url(#gbSheen)" filter="url(#gbBlur)" transform="rotate(-38 228 128)"/>
      <ellipse cx="196" cy="150" rx="40" ry="13" fill="#ffffff" opacity="0.75" filter="url(#gbBlurS)" transform="rotate(-44 196 150)"/>
      <ellipse cx="300" cy="238" rx="70" ry="16" fill="#ffffff" opacity="0.3" filter="url(#gbBlur)" transform="rotate(-28 300 238)"/>
    </g>
    <use href="#gbW1" fill="none" stroke="url(#gbRim1)" stroke-width="5"/>

    <!-- lower left wing -->
    <use href="#gbW2" fill="url(#gbB)"/>
    <g clip-path="url(#gbC2)">
      <use href="#gbW2" fill="none" stroke="#c79ade" stroke-opacity="0.75" stroke-width="30" filter="url(#gbBlur)"/>
      <ellipse cx="330" cy="330" rx="120" ry="90" fill="url(#gbDepth)" filter="url(#gbBlur)"/>
      <ellipse cx="222" cy="330" rx="76" ry="44" fill="url(#gbSheen)" filter="url(#gbBlur)" transform="rotate(-18 222 330)"/>
      <ellipse cx="196" cy="342" rx="36" ry="12" fill="#ffffff" opacity="0.7" filter="url(#gbBlurS)" transform="rotate(-22 196 342)"/>
      <ellipse cx="268" cy="412" rx="66" ry="14" fill="#ffffff" opacity="0.28" filter="url(#gbBlur)" transform="rotate(-14 268 412)"/>
    </g>
    <use href="#gbW2" fill="none" stroke="url(#gbRim2)" stroke-width="5"/>

    <!-- upper right wing -->
    <use href="#gbW3" fill="url(#gbC)"/>
    <g clip-path="url(#gbC3)">
      <use href="#gbW3" fill="none" stroke="#dd8cb6" stroke-opacity="0.75" stroke-width="30" filter="url(#gbBlur)"/>
      <ellipse cx="470" cy="300" rx="150" ry="86" fill="url(#gbDepth)" filter="url(#gbBlur)"/>
      <ellipse cx="614" cy="172" rx="104" ry="46" fill="url(#gbSheen)" filter="url(#gbBlur)" transform="rotate(-20 614 172)"/>
      <ellipse cx="648" cy="168" rx="52" ry="14" fill="#ffffff" opacity="0.8" filter="url(#gbBlurS)" transform="rotate(-16 648 168)"/>
      <ellipse cx="560" cy="286" rx="96" ry="18" fill="#ffffff" opacity="0.28" filter="url(#gbBlur)" transform="rotate(12 560 286)"/>
    </g>
    <use href="#gbW3" fill="none" stroke="url(#gbRim1)" stroke-width="5"/>

    <!-- lower right wing -->
    <use href="#gbW4" fill="url(#gbD)"/>
    <g clip-path="url(#gbC4)">
      <use href="#gbW4" fill="none" stroke="#b39ae2" stroke-opacity="0.75" stroke-width="30" filter="url(#gbBlur)"/>
      <ellipse cx="418" cy="330" rx="110" ry="80" fill="url(#gbDepth)" filter="url(#gbBlur)"/>
      <ellipse cx="520" cy="392" rx="80" ry="44" fill="url(#gbSheen)" filter="url(#gbBlur)" transform="rotate(34 520 392)"/>
      <ellipse cx="540" cy="372" rx="38" ry="12" fill="#ffffff" opacity="0.75" filter="url(#gbBlurS)" transform="rotate(38 540 372)"/>
      <ellipse cx="470" cy="452" rx="62" ry="14" fill="#ffffff" opacity="0.26" filter="url(#gbBlur)" transform="rotate(20 470 452)"/>
    </g>
    <use href="#gbW4" fill="none" stroke="url(#gbRim2)" stroke-width="5"/>

    <!-- body -->
    <g transform="translate(400 300) rotate(14)">
      <path d="M0 -104 C 18 -92, 24 -58, 22 -12 C 20 40, 12 84, 0 104 C -12 84, -20 40, -22 -12 C -24 -58, -18 -92, 0 -104 Z" fill="url(#gbBody)"/>
      <path d="M0 -104 C 18 -92, 24 -58, 22 -12 C 20 40, 12 84, 0 104 C -12 84, -20 40, -22 -12 C -24 -58, -18 -92, 0 -104 Z" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="4"/>
      <ellipse cx="-8" cy="-30" rx="6" ry="46" fill="#ffffff" opacity="0.55" filter="url(#gbBlurS)"/>
    </g>

    <!-- antennae -->
    <g fill="none" stroke="#e6bcd6" stroke-opacity="0.9" stroke-width="7" stroke-linecap="round">
      <path d="M388 204 C 366 158, 330 128, 292 116"/>
      <path d="M412 202 C 416 152, 434 118, 466 96"/>
    </g>
    <circle cx="290" cy="115" r="9" fill="#f4cee1"/>
    <circle cx="468" cy="95" r="9" fill="#f4cee1"/>
  </g>
</svg>
